name: Desktop Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: VisualCataloguer-macos-arm64
          - os: macos-13
            artifact: VisualCataloguer-macos-x64
          - os: windows-latest
            artifact: VisualCataloguer-windows-x64
          - os: ubuntu-latest
            artifact: VisualCataloguer-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pywebview's default GTK backend needs system introspection libs that
      # are painful to freeze; the Qt backend bundles cleanly with PyInstaller.
      - name: Install Linux Qt backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0
          python -m pip install "pywebview[qt]"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]" pyinstaller

      - name: Build desktop binary
        run: pyinstaller packaging/desktop.spec --noconfirm

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent "Visual Cataloguer.app" "${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/VisualCataloguer.exe -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf "${{ matrix.artifact }}.tar.gz" VisualCataloguer

      - name: Smoke test (server starts headless)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            BIN="dist/Visual Cataloguer.app/Contents/MacOS/VisualCataloguer"
          else
            BIN="dist/VisualCataloguer"
          fi
          "$BIN" --no-gui --port 8123 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/api/health > /dev/null; then
              echo "health check passed"
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          echo "server never became healthy" >&2
          kill $APP_PID || true
          exit 1

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/VisualCataloguer.exe" -ArgumentList "--no-gui","--port","8123" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8123/api/health" -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Error "server never became healthy"; exit 1 }
          Write-Output "health check passed"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
