# Development: builds from local source instead of pulling from GHCR
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/data/collection.db
    restart: unless-stopped
